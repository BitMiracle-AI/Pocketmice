name: CI

on:
  push:
    # develop is where work lands, main is what is released
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch replaces the one still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository
permissions:
  contents: read

jobs:
  # The same command as before a push from a developer's machine: the checks, then every test
  check:
    runs-on: ubuntu-latest
    # It takes about a minute. Much longer means something hangs: fail then, not after the default six hours
    timeout-minutes: 10
    services:
      # Every test file creates a temporary database of its own and drops it when done, so the role must be allowed
      # to create databases. This one owns the server
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pocketmice
          POSTGRES_PASSWORD: pocketmice
          POSTGRES_DB: pocketmice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username pocketmice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://pocketmice:pocketmice@localhost:5432/pocketmice
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other code later
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Takes the version of pnpm from packageManager in package.json, the one place it is written
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # The oldest Node the repository allows (devEngines in package.json)
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:all

  # A credential that gets into the history stays there, and this repository is meant to be public. Every commit is
  # read on every push. What the scan may pass over is in .gitleaks.toml
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The whole history, not only the newest commit
          fetch-depth: 0
      # The program itself, checked against the checksum of the release, so that a release replaced later fails here
      # and is not run over the history
      - run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .
