<!-- The icon of the web app: a pocket mouse looking out of a folder, its paws on the edge. One drawing for every
     size a browser asks for. The two blues are the app's own (src/index.css), written as hex: not every program
     that reads an icon knows oklch. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Pocketmice</title>
  <!-- The back of the folder, with its tab -->
  <path fill="#193cb8" d="M2.5 12A2.5 2.5 0 0 1 5 9.5h5.2c.8 0 1.5.3 2 .9l1 1.2c.5.6 1.2.9 2 .9H27a2.5 2.5 0 0 1 2.5 2.5v12A2.5 2.5 0 0 1 27 29.5H5A2.5 2.5 0 0 1 2.5 27z"/>
  <!-- The mouse, drawn round the middle of its face: ears, forehead, the two full cheeks, eyes, nose -->
  <g transform="translate(18.6 13.8) scale(.84)">
    <circle fill="#f3b866" cx="-7.6" cy="-7.6" r="4.1"/>
    <circle fill="#f3b866" cx="7.6" cy="-7.6" r="4.1"/>
    <circle fill="#ff9cab" cx="-7.6" cy="-7.6" r="2.1"/>
    <circle fill="#ff9cab" cx="7.6" cy="-7.6" r="2.1"/>
    <circle fill="#f3b866" cx="0" cy="-1.5" r="8.6"/>
    <circle fill="#fff2dc" cx="-6" cy="4.4" r="6.4"/>
    <circle fill="#fff2dc" cx="6" cy="4.4" r="6.4"/>
    <ellipse fill="#fff2dc" cx="0" cy="6.2" rx="4" ry="3.2"/>
    <circle fill="#162456" cx="-4.4" cy="-2.6" r="1.7"/>
    <circle fill="#162456" cx="4.4" cy="-2.6" r="1.7"/>
    <ellipse fill="#ef6f88" cx="0" cy="1.5" rx="1.4" ry="1.05"/>
  </g>
  <!-- The front of the folder, over the lower half of the face -->
  <rect fill="#2b7fff" x="2.5" y="17.5" width="27" height="12" rx="2.5"/>
  <!-- The paws, over its edge -->
  <rect fill="#f3b866" x="12.3" y="15.9" width="3.8" height="3.5" rx="1.75"/>
  <rect fill="#f3b866" x="21.1" y="15.9" width="3.8" height="3.5" rx="1.75"/>
</svg>
