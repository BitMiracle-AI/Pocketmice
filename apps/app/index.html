<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocketmice</title>
    <!-- There is no icon yet. This says so: without it every browser asks for /favicon.ico, and is answered that
         there is none. -->
    <link rel="icon" href="data:," />
    <!-- Whether the page is dark: it is when the system is, and <html> then has the class dark, which the styles
         go by. Decided here, before anything is drawn and before our code arrives: decided later, someone whose
         system is dark would see a white page first, every time they open one. -->
    <script>
      (() => {
        const system = matchMedia('(prefers-color-scheme: dark)');
        const follow = () => document.documentElement.classList.toggle('dark', system.matches);
        follow();
        system.addEventListener('change', follow);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
