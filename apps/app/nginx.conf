# How the built pages are handed out. In the image this file is /etc/nginx/conf.d/default.conf (see Dockerfile).

# The container's own health check (see Dockerfile) asks for the first page every 10 seconds, from inside the
# container. It is kept out of the access log, where it would bury the real visits. Those all arrive through the
# reverse proxy outside the container, never from 127.0.0.1.
map $remote_addr $pocketmice_app_from_outside {
  127.0.0.1 0;
  default 1;
}

server {
  # 11211 is the port of the web app. The reverse proxy outside the container sends its requests here
  listen 11211;
  root /usr/share/nginx/html;

  # Where the log goes and its format (main) are the nginx image's own. They are repeated here to add the condition
  access_log /var/log/nginx/access.log main if=$pocketmice_app_from_outside;

  # The scripts and styles go out compressed: they are most of what a first visit downloads
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # What the build makes (scripts, styles, fonts) is under /assets/, and each name carries a fingerprint of the
  # content: other content is another name, so a browser may keep a file for good.
  # One that is not there is answered 404, and not with the first page: an old page asking for a script that is
  # gone after a new build would get HTML where it expects a script, and fail with an error nobody can read.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other address is a route inside the pages, and is answered with the first page. A browser asks each time
  # whether that page has changed: or after a new build it would go on with the old one, which asks for scripts
  # that no longer exist.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
